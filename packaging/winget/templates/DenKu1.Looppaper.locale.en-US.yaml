ShortDescription: Lightweight live-wallpaper engine for Windows with no UI (looping video or picture slideshow).
Description: |-
  Looppaper puts a looping .mp4 video, one fixed picture, or a slideshow of pictures from a folder behind
  the desktop icons. It has no settings window: it is configured with a JSON file and command-line switches,
  runs at low priority with Windows efficiency mode, and restores the normal wallpaper when it stops.
  After installing, run "looppaper --install-startup" to start it when you sign in.
