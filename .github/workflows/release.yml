name: release

# Pushing a version tag publishes a GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a pre-release suffix (v0.3.0-beta.1) become pre-releases.
# Running the workflow by hand (workflow_dispatch) is a dry run: it builds and packs the zip and
# uploads it as a workflow artifact, but creates no tag and no release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry-run package (X.Y.Z); empty = the version in Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT -eq 'push') {
            $version = $env:REF_NAME -replace '^v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION -replace '^v', ''
          } else {
            $match = Select-String -Path Directory.Build.props -Pattern '<Version[^>]*>([^<]+)</Version>' | Select-Object -First 1
            $version = $match.Matches[0].Groups[1].Value.Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
          }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (prerelease: $prerelease)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/Looppaper -p:PublishProfile=win-x64 -p:Version=${{ steps.version.outputs.version }}

      - name: Check version stamp
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $info = (Get-Item publish/Looppaper.exe).VersionInfo
          Write-Host "ProductVersion $($info.ProductVersion), FileVersion $($info.FileVersion)"
          if (-not $info.ProductVersion.StartsWith($env:VERSION)) {
            throw "Looppaper.exe has product version $($info.ProductVersion), expected $env:VERSION"
          }

      # Optional Authenticode signing. Runs only when both repository secrets exist:
      #   SIGNING_CERT_BASE64   - the code-signing certificate as a base64-encoded .pfx
      #                           ([Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx')))
      #   SIGNING_CERT_PASSWORD - the .pfx password
      # Without them the release is built unsigned and this step is skipped.
      - name: Check signing secrets
        id: signing
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $enabled = if ($env:SIGNING_CERT_BASE64 -and $env:SIGNING_CERT_PASSWORD) { 'true' } else { 'false' }
          "enabled=$enabled" >> $env:GITHUB_OUTPUT
          if ($enabled -eq 'true') { Write-Host 'Signing secrets found: Looppaper.exe will be signed.' }
          else { Write-Host 'No signing secrets (SIGNING_CERT_BASE64 / SIGNING_CERT_PASSWORD): building unsigned.' }

      - name: Sign Looppaper.exe
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_CERT_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 /d Looppaper publish/Looppaper.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa /v publish/Looppaper.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE)" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      # Alternative: Azure Trusted Signing (no .pfx; Microsoft holds the key). Replace the two steps above
      # with this one and add the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET (an app
      # registration with the "Trusted Signing Certificate Profile Signer" role). Check the action's current
      # release before enabling it and pin that exact version.
      #
      # - name: Sign Looppaper.exe (Azure Trusted Signing)
      #   if: steps.signing.outputs.enabled == 'true'   # with the check step above testing AZURE_CLIENT_ID instead
      #   uses: azure/trusted-signing-action@v0.5.1
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: https://weu.codesigning.azure.net/
      #     trusted-signing-account-name: <account name>
      #     certificate-profile-name: <certificate profile name>
      #     files-folder: publish
      #     files-folder-filter: exe
      #     file-digest: SHA256
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version '${{ steps.version.outputs.version }}' -PublishDir publish -OutputDir artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: Looppaper-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/Looppaper-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/Looppaper-${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $zip = "artifacts/Looppaper-$env:VERSION-win-x64.zip"
          $arguments = @(
            'release', 'create', $env:TAG, $zip, "$zip.sha256",
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "Looppaper $env:VERSION",
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
